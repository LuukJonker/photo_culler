[package]
name = "photo_culler"
version = "0.1.0"
edition = "2024"

[package.metadata.packager]
product-name = "Green Room"
identifier = "com.greenroom.app"
authors = ["Luuk"]
description = "High-performance, GPU-accelerated RAW photo culling and editing."
# homepage = "https://github.com/LuukJonker/green_room"

# Universal Asset Paths
icons = [
    "assets/icon.icns", 
    "assets/icon.ico", 
    "assets/icon.png"
]

# Targeted Installers
# formats = ["app", "dmg", "nsis", "deb"]

# macOS Specific: Tells the OS it is a photography management app
# [package.metadata.packager.macos]
# category = "public.app-category.photography"

# Windows Specific: Configuration for the NSIS installer wizard
# [package.metadata.packager.nsis]
# install-mode = "perUser" # Allows installation without requiring Windows Admin elevation


[dependencies]
appdirs = "0.2.0"
byteorder = "1.5.0"
crossbeam = "0.8.4"
image = "0.25.9"
kamadak-exif = "0.6.1"
mimetype-detector = "0.3.9"
nalgebra = "0.35.0"
rfd = "0.15.2"
rsraw = "0.1.1"
serde = "1.0.228"
serde_json = "1.0.149"
slint = "1.15"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tracing-unwrap = "1.0.1"


[build-dependencies]
slint-build = "1.15"
