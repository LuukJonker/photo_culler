name: Package Application

on:
  push:
    branches:
      - ci-cd

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Install standard Rust for macOS and Linux
      - name: Install Rust (macOS/Linux)
        if: matrix.platform != 'windows'
        uses: dtolnay/rust-toolchain@stable

      # Install GNU Rust for Windows to compile LibRaw properly
      - name: Install Rust (Windows GNU)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu 
          targets: x86_64-pc-windows-gnu

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libraw-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install cmake libraw

      # Install MSYS2 to ensure GCC/MinGW is available on Windows
      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release

      # Force output to a dedicated 'dist' directory so we know exactly where the installers are
      - name: Package
        run: cargo packager --release --out-dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist/*

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout the MAIN branch instead of the trigger branch (ci-cd)
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: tmp-installers
          pattern: installers-*
          merge-multiple: true

      - name: Commit and push installers to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Create installers directory if it doesn't exist
          mkdir -p installers
          
          # Clear old installers to avoid bloating the repo with stale versions
          rm -rf installers/*
          
          # Copy newly downloaded artifacts
          cp -r tmp-installers/* installers/
          
          # Create a README
          cat <<EOF > installers/README.md
          # Green Room Installers
          This folder contains the latest builds for all platforms.
          - **Windows**: .msi, .nsis
          - **macOS**: .dmg, .app
          - **Linux**: .deb, .AppImage
          EOF

          # Stage the files
          git add installers/
          
          # Commit and push to main
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # We add [skip ci] so pushing to main doesn't accidentally trigger other workflows
            git commit -m "chore: Update release installers [skip ci]"
            git push origin main
          fi
